  const favMark=i.fav?'<span title="已收藏">★</span>':"";
  const briefMark=isBrief?'<span class="brief-mark">简报</span>':"";
  const favBtn=isBrief?"":('<button type="button" class="'+starCls+'" title="'+starTitle+'" aria-label="'+starTitle+'" data-fav-id="'+esc(i.id)+'">'+starChar+"</button>");
  const who=isBrief?"每日简报":("@"+esc(i.user));
  return '<a class="card" href="'+itemHref(i)+'" target="_blank" rel="noopener">'
    +favBtn
    +imgHtml
    +'<div class="body"><div class="meta"><span class="tag t-'+esc(i.category)+'">'+esc(i.category)+"</span>"+briefMark+"<span>"+ago(i.created_at||i.added_at)+"</span>"+favMark+"</div>"
    +"<h2>"+esc(i.title)+"</h2><p>"+esc(i.summary)+"</p>"
    +'<div class="foot"><span class="who">'+who+'</span><span class="stats">'+stats+"</span></div></div></a>";
}
function filterItems(){
  if(cur==="收藏")return DATA.filter(function(i){return isStarred(i)});
  if(cur==="全部")return DATA.filter(function(i){return !i._archive_only});
  return DATA.filter(function(i){return !i._archive_only&&i.category===cur});
}
function tabs(){
  const favN=DATA.filter(function(i){return isStarred(i)}).length;
  document.getElementById("tabs").innerHTML=cats.map(function(c){
    var n="";
    if(c==="收藏")n=" "+favN;
    else if(c!=="全部")n=" "+DATA.filter(function(i){return !i._archive_only&&i.category===c}).length;
    return '<button class="tab'+(c===cur?" on":"")+'" data-c="'+c+'">'+c+n+"</button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){cur=b.getAttribute("data-c");location.hash=cur;render()};
  });
}
function colCount(){
  const w=window.innerWidth;
  const pad=w<=640?24:40;
  const gap=w<=640?10:16;
  const minW=w<=640?160:280;
  const inner=Math.min(1280,w)-pad;
  var n=Math.floor((inner+gap)/(minW+gap));
  if(n<1)n=1;
  if(n>4)n=4;
  return n;
}
function bindFav(root){
  Array.prototype.forEach.call(root.querySelectorAll("[data-fav-id]"),function(btn){
    if(btn._bound)return;
    btn._bound=true;
    btn.addEventListener("click",function(ev){toggleFav(ev,btn.getAttribute("data-fav-id"))});
  });
}
function render(){
  tabs();
  const it=filterItems();
  const feed=document.getElementById("feed");
  if(!it.length){
    feed.innerHTML='<div class="empty">暂无内容</div>';
    return;
  }
  const n=colCount();
  const first=Math.min(it.length,n*6);
  const cols=[];
  for(var i=0;i<n;i++)cols.push([]);
  it.slice(0,first).forEach(function(item,idx){cols[idx%n].push(cardHtml(item))});
  feed.innerHTML=cols.map(function(c){return '<div class="col">'+c.join("")+"</div>"}).join("");
  bindFav(feed);
  if(it.length>first){
    requestAnimationFrame(function(){
      it.slice(first).forEach(function(item,idx){
        const col=feed.children[(first+idx)%n];
        if(col)col.insertAdjacentHTML("beforeend",cardHtml(item));
      });
      bindFav(feed);
    });
  }
}
var _cols=0;
window.addEventListener("resize",function(){
  const n=colCount();
  if(n!==_cols){_cols=n;render()}
});
_cols=colCount();
render();
</script>
</body></html>
