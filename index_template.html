<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 热帖精选 · 汽车 / AI / 机器人</title>
<link rel="alternate" type="application/rss+xml" title="X 热帖精选" href="feed.xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><div class="bar">
<h1>X 热帖精选<small>每 3 小时更新 · 更新于 <span id="upd"></span></small></h1>
<div class="tabs" id="tabs"></div>
<div class="navlinks">
<a href="archive/index.html">收藏归档</a>
<a href="archive/text.html">更早内容</a>
<span>·</span>
RSS：<a href="feed.xml">全部</a><a href="feed-auto.xml">汽车</a><a href="feed-ai.xml">AI</a><a href="feed-robot.xml">机器人</a>
</div>
</div></header>
<main id="feed"></main>
<footer>内容整理自 X 公开帖子，版权归原作者所有</footer>
<div class="toast" id="toast"></div>
<script>
const DATA=__DATA__;
const UPD="__UPDATED__";
const BASE_PATH="__BASE_PATH__";
document.getElementById("upd").textContent=UPD;
const LS_KEY="xhot_favs";
const fmt=n=>n==null?"":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":n;
const ago=s=>{const d=(Date.now()-new Date(s))/36e5;return d<1?"刚刚":d<24?Math.floor(d)+" 小时前":Math.floor(d/24)+" 天前"};
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return{}}}
function saveLocal(m){localStorage.setItem(LS_KEY,JSON.stringify(m))}
(function syncLocal(){const m=loadLocal();let ch=false;DATA.forEach(i=>{if(m[i.id]===true&&i.fav){delete m[i.id];ch=true}if(m[i.id]===false&&!i.fav){delete m[i.id];ch=true}});if(ch)saveLocal(m)})();
function isStarred(i){if(i.fav)return true;const m=loadLocal();return m[i.id]===true}
function mediaSrc(u){if(!u)return"";if(/^https?:\/\//i.test(u))return u;return (BASE_PATH||"")+u}
const cats=["全部","汽车","AI","机器人","收藏"];
let cur=location.hash?decodeURIComponent(location.hash.slice(1)):"全部";
if(cats.indexOf(cur)<0)cur="全部";
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},3200)}
function toggleFav(ev,id){
  ev.preventDefault();ev.stopPropagation();
  const item=DATA.find(function(x){return x.id===id})||{id:id,title:"",user:"",fav:false};
  const on=isStarred(item);
  const m=loadLocal();
  m[id]=!on;
  saveLocal(m);
  const action=on?"取消收藏":"收藏";
  const link="https://x.com/"+item.user+"/status/"+id;
  const body=(item.title||"")+"\n"+link;
  const url="https://github.com/DukeYang/x-hot-feed/issues/new?title="+encodeURIComponent(action+" "+id)+"&labels=fav&body="+encodeURIComponent(body);
  window.open(url,"_blank","noopener");
  toast("已标记，提交 GitHub Issue 后将立即同步");
  render();
}
function cardHtml(i){
  const m=i.metrics||{};
  const img=(i.media||[])[0];
  const star=isStarred(i);
  const starCls=star?"fav-btn on":"fav-btn";
  const starChar=star?"★":"☆";
  const starTitle=star?"取消收藏":"收藏";
  let imgHtml="";
  if(img){
    imgHtml='<img loading="lazy" src="'+esc(mediaSrc(img))+'" alt="" onerror="this.remove()">';
  }
  let stats="";
  if(m.likes!=null)stats+="<span>♥ "+fmt(m.likes)+"</span>";
  if(m.retweets!=null)stats+="<span>⇄ "+fmt(m.retweets)+"</span>";
  if(m.views!=null)stats+="<span>◉ "+fmt(m.views)+"</span>";
  const favMark=i.fav?'<span title="已收藏">★</span>':"";
  return '<a class="card" href="https://x.com/'+esc(i.user)+"/status/"+esc(i.id)+'" target="_blank" rel="noopener">'
    +'<button type="button" class="'+starCls+'" title="'+starTitle+'" aria-label="'+starTitle+'" data-fav-id="'+esc(i.id)+'">'+starChar+"</button>"
    +imgHtml
    +'<div class="body"><div class="meta"><span class="tag t-'+esc(i.category)+'">'+esc(i.category)+"</span><span>"+ago(i.created_at||i.added_at)+"</span>"+favMark+"</div>"
    +"<h2>"+esc(i.title)+"</h2><p>"+esc(i.summary)+"</p>"
    +'<div class="foot"><span class="who">@'+esc(i.user)+'</span><span class="stats">'+stats+"</span></div></div></a>";
}
function filterItems(){
  if(cur==="收藏")return DATA.filter(function(i){return isStarred(i)});
  if(cur==="全部")return DATA.filter(function(i){return !i._archive_only});
  return DATA.filter(function(i){return !i._archive_only&&i.category===cur});
}
function tabs(){
  const favN=DATA.filter(function(i){return isStarred(i)}).length;
  document.getElementById("tabs").innerHTML=cats.map(function(c){
    var n="";
    if(c==="收藏")n=" "+favN;
    else if(c!=="全部")n=" "+DATA.filter(function(i){return !i._archive_only&&i.category===c}).length;
    return '<button class="tab'+(c===cur?" on":"")+'" data-c="'+c+'">'+c+n+"</button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){cur=b.getAttribute("data-c");location.hash=cur;render()};
  });
}
function render(){
  tabs();
  const it=filterItems();
  const feed=document.getElementById("feed");
  feed.innerHTML=it.length?it.map(cardHtml).join(""):'<div class="empty">暂无内容</div>';
  Array.prototype.forEach.call(feed.querySelectorAll("[data-fav-id]"),function(btn){
    btn.addEventListener("click",function(ev){toggleFav(ev,btn.getAttribute("data-fav-id"))});
  });
}
render();
</script>
</body></html>
